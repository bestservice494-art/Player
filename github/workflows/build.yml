name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL -o p.zip https://sexynightwear.net/ibo-panel/player-native.zip
          unzip -q p.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7, build-root-directory: native }
      - run: gradle assembleDebug
        working-directory: native
      - uses: actions/upload-artifact@v4
        with: { name: player-apk, path: native/app/build/outputs/apk/debug/app-debug.apk }
